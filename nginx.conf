server {
    listen 80;
    server_name _;

    # The app is built with base path /WhatAboutThisPath/ (see vite.config.js,
    # needed for GitHub Pages project sites), so its HTML references assets
    # under that path regardless of which URL loaded it. Serve the same files
    # at both "/" and "/WhatAboutThisPath/" instead of redirecting (a 302 to a
    # relative path would drop the host's port).
    location /WhatAboutThisPath/ {
        alias /usr/share/nginx/html/WhatAboutThisPath/;
        try_files $uri $uri/ /WhatAboutThisPath/index.html;
    }

    location / {
        alias /usr/share/nginx/html/WhatAboutThisPath/;
        try_files $uri $uri/ /WhatAboutThisPath/index.html;
    }
}
